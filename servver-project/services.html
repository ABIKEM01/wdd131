<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Servver — a service booking platform for Nigeria. Discover, compare and book trusted service workers."
    />
    <meta name="author" content="Abiodun Babayode" />
    <title>Servver — Services</title>
    <link rel="stylesheet" href="styles/servver.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo"
          ><img
            src="images/servver-logo.webp"
            alt="Servver logo"
            width="120"
            loading="lazy"
        /></a>
        <nav aria-label="Main navigation">
          <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1>Services</h1>

      <section class="filters" aria-label="Service filters">
        <label for="categorySelect">Category</label>
        <select id="categorySelect">
          <option value="all">All</option>
        </select>

        <label for="searchInput">Search</label>
        <input
          id="searchInput"
          type="search"
          placeholder="Search services by name or skill"
        />

        <button id="applyFilters" class="btn">Apply</button>
      </section>

      <section aria-labelledby="servicesHeading">
        <h2 id="servicesHeading">Available providers</h2>
        <div id="serviceGrid" class="card-grid" aria-live="polite"></div>
      </section>

      <section class="saved container">
        <h2>Saved Bookings</h2>
        <div id="bookingsList"></div>
      </section>
    </main>

    <footer>
      <p>
        &copy; <span id="year"></span> 🌸Servver Incorporated Limited 🌸 Lagos,
        Nigeria
      </p>
      <p><a href="references.html">References</a></p>
      <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

    <script src="scripts/servver.js"></script>
  </body>
</html>
